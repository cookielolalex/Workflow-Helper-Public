services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-northeast-1
    ports:
      - "4566:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal s3api head-bucket --bucket workflow-helper-raw-dev &&
          awslocal s3api head-bucket --bucket workflow-helper-processed-dev &&
          awslocal sqs get-queue-url --queue-name workflow-helper-processing
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  api:
    build: ./apps/api
    env_file: .env
    environment:
      AWS_S3_PRESIGNED_ENDPOINT_URL: ${AWS_S3_PRESIGNED_ENDPOINT_URL:-http://localhost:4566}
      MAX_METADATA_SIZE_BYTES: ${MAX_METADATA_SIZE_BYTES:-1048576}
      MAX_PACKAGE_SIZE_BYTES: ${MAX_PACKAGE_SIZE_BYTES:-536870912}
      UPLOAD_SPOOL_MEMORY_BYTES: ${UPLOAD_SPOOL_MEMORY_BYTES:-8388608}
      UPLOAD_STREAM_CHUNK_BYTES: ${UPLOAD_STREAM_CHUNK_BYTES:-1048576}
      WORKFLOW_WORKER_TOKEN: ${WORKFLOW_WORKER_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: ./apps/worker
    env_file: .env
    environment:
      MAX_PACKAGE_SIZE_BYTES: ${MAX_PACKAGE_SIZE_BYTES:-536870912}
      UPLOAD_SPOOL_MEMORY_BYTES: ${UPLOAD_SPOOL_MEMORY_BYTES:-8388608}
      UPLOAD_STREAM_CHUNK_BYTES: ${UPLOAD_STREAM_CHUNK_BYTES:-1048576}
      WORKFLOW_WORKER_TOKEN: ${WORKFLOW_WORKER_TOKEN:-}
      WORKER_CALLBACK_MAX_ATTEMPTS: "3"
      WORKER_MAX_MESSAGE_ATTEMPTS: "3"
      WORKER_MAX_SERVICE_FAILURES: "3"
      WORKER_RETRY_BASE_SECONDS: "1"
    restart: "on-failure:5"
    depends_on:
      localstack:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
