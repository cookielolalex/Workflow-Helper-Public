services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-northeast-1
    ports:
      - "4566:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal s3api head-bucket --bucket workflow-helper-raw-dev &&
          awslocal s3api head-bucket --bucket workflow-helper-processed-dev &&
          awslocal sqs get-queue-url --queue-name workflow-helper-processing
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  api:
    build: ./apps/api
    env_file: ${WORKFLOW_COMPOSE_ENV_FILE:-.env}
    command: ["python", "-m", "workflow_api.dev_server"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      WORKFLOW_DEV_DATA_DIR: ${WORKFLOW_DEV_DATA_DIR:-}
      WORKFLOW_DEV_CAPTURE_PROOF: ${WORKFLOW_DEV_CAPTURE_PROOF:-}
      WORKFLOW_DEV_WORKER_PROOF: ${WORKFLOW_DEV_WORKER_PROOF:-}
      WORKFLOW_DEV_REVIEWER_PROOF: ${WORKFLOW_DEV_REVIEWER_PROOF:-}
      WORKFLOW_DEV_REVIEWER_SESSION: ${WORKFLOW_DEV_REVIEWER_SESSION:-}
      WORKFLOW_DEV_REVIEWER_CSRF: ${WORKFLOW_DEV_REVIEWER_CSRF:-}
      MAX_METADATA_SIZE_BYTES: ${MAX_METADATA_SIZE_BYTES:-1048576}
      MAX_PACKAGE_SIZE_BYTES: ${MAX_PACKAGE_SIZE_BYTES:-536870912}
      UPLOAD_SPOOL_MEMORY_BYTES: ${UPLOAD_SPOOL_MEMORY_BYTES:-8388608}
      UPLOAD_STREAM_CHUNK_BYTES: ${UPLOAD_STREAM_CHUNK_BYTES:-1048576}
      WORKFLOW_WORKER_TOKEN: ${WORKFLOW_WORKER_TOKEN:-}
    ports:
      - "${WORKFLOW_API_PORT:-8000}:8000"
    volumes:
      - dev-runtime-data:/var/lib/workflow-helper
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          response=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2);
          payload=json.load(response);
          assert response.status == 200 and payload.get('environment') == 'synthetic'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: ./apps/worker
    env_file: ${WORKFLOW_COMPOSE_ENV_FILE:-.env}
    environment:
      MAX_PACKAGE_SIZE_BYTES: ${MAX_PACKAGE_SIZE_BYTES:-536870912}
      UPLOAD_SPOOL_MEMORY_BYTES: ${UPLOAD_SPOOL_MEMORY_BYTES:-8388608}
      UPLOAD_STREAM_CHUNK_BYTES: ${UPLOAD_STREAM_CHUNK_BYTES:-1048576}
      WORKFLOW_WORKER_TOKEN: ${WORKFLOW_WORKER_TOKEN:-}
      WORKER_CALLBACK_MAX_ATTEMPTS: "3"
      WORKER_MAX_MESSAGE_ATTEMPTS: "3"
      WORKER_MAX_SERVICE_FAILURES: "3"
      WORKER_RETRY_BASE_SECONDS: "1"
    restart: "on-failure:5"
    depends_on:
      localstack:
        condition: service_healthy
      api:
        condition: service_started

  seed:
    build: ./apps/api
    env_file: ${WORKFLOW_COMPOSE_ENV_FILE:-.env}
    command: ["python", "/workspace/dev-runtime-seed.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      WORKFLOW_DEV_DATA_DIR: ${WORKFLOW_DEV_DATA_DIR:-}
      WORKFLOW_DEV_CAPTURE_PROOF: ${WORKFLOW_DEV_CAPTURE_PROOF:-}
      WORKFLOW_DEV_WORKER_PROOF: ${WORKFLOW_DEV_WORKER_PROOF:-}
      WORKFLOW_DEV_REVIEWER_PROOF: ${WORKFLOW_DEV_REVIEWER_PROOF:-}
      WORKFLOW_DEV_REVIEWER_SESSION: ${WORKFLOW_DEV_REVIEWER_SESSION:-}
      WORKFLOW_DEV_REVIEWER_CSRF: ${WORKFLOW_DEV_REVIEWER_CSRF:-}
      WORKFLOW_DEV_CONTRACT_PATH: /workspace/session.json
      PYTHONPATH: /workspace/worker-src
      RAW_BUCKET: ${RAW_BUCKET:-workflow-helper-raw-dev}
      PROCESSED_BUCKET: ${PROCESSED_BUCKET:-workflow-helper-processed-dev}
    volumes:
      - dev-runtime-data:/var/lib/workflow-helper
      - ./scripts/dev-runtime-seed.py:/workspace/dev-runtime-seed.py:ro
      - ./contracts/examples/session.json:/workspace/session.json:ro
      - ./apps/worker/src:/workspace/worker-src:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    build: ./apps/web
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      API_BASE_URL: http://api:8000
      WORKFLOW_REVIEW_API_BASE_URL: http://api:8000
      WORKFLOW_DEV_REVIEWER_PROOF: ${WORKFLOW_DEV_REVIEWER_PROOF:-}
      WORKFLOW_DEV_REVIEWER_SESSION: ${WORKFLOW_DEV_REVIEWER_SESSION:-}
      WORKFLOW_DEV_REVIEWER_CSRF: ${WORKFLOW_DEV_REVIEWER_CSRF:-}
      WORKFLOW_REVIEW_BROWSER_ORIGIN: http://127.0.0.1:${WORKFLOW_WEB_PORT:-3000}
      WORKFLOW_REVIEW_BROWSER_HOST: 127.0.0.1:${WORKFLOW_WEB_PORT:-3000}
    ports:
      - "${WORKFLOW_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  dev-runtime-data:
  postgres-data:
